
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form - Mindful Wear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="clothing icon.png">
</head>

<body class="contact-page">

  <nav>
    <a href="fastfashion.html">Fast Fashion</a>
    <a href="sustainable.html">Sustainable Tips</a>
    <a href="index.html">Home</a>
  </nav>

  <header>
    <img src="Logo.png" alt="Mindful Wear logo">
    <h1>Mindful Wear</h1>
  </header>

  <h2>Contact Form</h2>

  <hr>

  <form>

    <label class="field-label" for="firstname">First Name:</label>
    <input type="text" id="firstname">
    <br><br>

    <label class="field-label" for="lastname">Last Name:</label>
    <input type="text" id="lastname">
    <br><br>

    <label class="field-label" for="email">Email Address:</label>
    <input type="text" id="email">
    <br><br>

    <label class="field-label" for="password">Password:</label>
    <input type="password" id="password">
    <br><br>

    <label class="field-label" for="confirmpassword">Confirm Password:</label>
    <input type="password" id="confirmpassword">
    <br><br>

    <label class="field-label" for="phone">Phone Number:</label>
    <input type="text" id="phone">
    <br><br>

    <label class="field-label" for="city">City:</label>
    <input type="text" id="city">
    <br><br>

    <input type="checkbox" id="terms">
    <label for="terms">I agree to the terms and conditions</label>
    <br><br>

    <button type="submit">Submit</button>

  </form>

  <footer>
    <p>Mindful Wear | Kaitiakitanga</p>
  </footer>

</body>
</html>
